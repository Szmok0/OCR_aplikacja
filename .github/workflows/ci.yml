name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Windows is the primary target (office laptops); Linux mirrors the
        # cloud dev environment.
        os: [windows-latest, ubuntu-latest]
        python: ["3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      LOKALOCR_REQUIRE_TESSERACT: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Tesseract (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tesseract-ocr tesseract-ocr-pol tesseract-ocr-eng \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install Tesseract (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          $tessdata = "C:\Program Files\Tesseract-OCR\tessdata"
          foreach ($lang in @("pol", "eng")) {
            $target = Join-Path $tessdata "$lang.traineddata"
            if (-not (Test-Path $target)) {
              Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/$lang.traineddata" -OutFile $target
            }
          }
          & "C:\Program Files\Tesseract-OCR\tesseract.exe" --list-langs
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint, types, tests, licenses
        run: python scripts/check.py

  full-mode:
    # Docling + local models (stage 6). Models come from Hugging Face here,
    # in CI only; the application itself never downloads anything (§6.4).
    name: full mode (Docling) / ubuntu / py3.12
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      LOKALOCR_REQUIRE_TESSERACT: "1"
      LOKALOCR_REQUIRE_MODELS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Tesseract and Qt libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tesseract-ocr tesseract-ocr-pol tesseract-ocr-eng \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install (CPU-only PyTorch, then the full extra)
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,full]"
      - name: Licences of the full-mode dependencies
        run: python scripts/check_licenses.py --extras full
      - name: Cache models
        id: models-cache
        uses: actions/cache@v5
        with:
          path: models
          key: docling-models-2.138.0-${{ hashFiles('scripts/fetch_models.py') }}
      - name: Download models
        if: steps.models-cache.outputs.cache-hit != 'true'
        run: python scripts/fetch_models.py
      - name: Verify models and show their licences
        run: |
          python scripts/fetch_models.py --verify
          python scripts/model_licenses.py
      - name: Full-mode tests
        run: python -m pytest -v -m "docling or models" tests/test_full_mode.py tests/test_docling_map.py
