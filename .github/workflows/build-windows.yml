name: Build Windows package

# Prototype packages for the owner (stage 7): one-folder PyInstaller builds
# with Tesseract (pol + eng) bundled, attached as artifacts. Builds of main are
# also published as the "najnowsza" release, so the download link never changes:
# https://github.com/Szmok0/OCR_aplikacja/releases/latest
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/build-windows.yml"
      - "src/lokalocr/selftest.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: windows / ${{ matrix.variant }}
    runs-on: windows-latest
    timeout-minutes: 60
    # The full variant (Docling + PyTorch + models) is experimental for now.
    continue-on-error: ${{ matrix.variant == 'full' }}
    strategy:
      fail-fast: false
      matrix:
        variant: [basic, full]
    env:
      PYTHONUTF8: "1"
      LOKALOCR_BUILD_FULL: ${{ matrix.variant == 'full' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Tesseract
        shell: pwsh
        run: |
          # The Chocolatey feed occasionally times out (HTTP 504): retry.
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install tesseract -y --no-progress
            if (Test-Path "C:\Program Files\Tesseract-OCR\tesseract.exe") { break }
            Write-Host "choco install failed (attempt $attempt), retrying in 20 s"
            Start-Sleep -Seconds 20
          }
          if (-not (Test-Path "C:\Program Files\Tesseract-OCR\tesseract.exe")) { throw "Tesseract install failed" }
          $tessdata = "C:\Program Files\Tesseract-OCR\tessdata"
          foreach ($lang in @("pol", "eng", "osd")) {
            $target = Join-Path $tessdata "$lang.traineddata"
            if (-not (Test-Path $target)) {
              Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/$lang.traineddata" -OutFile $target
            }
          }

      - name: Prepare the Tesseract bundle (binary, DLLs, pol/eng/osd data, licences)
        shell: pwsh
        run: |
          $src = "C:\Program Files\Tesseract-OCR"
          $dst = Join-Path $env:RUNNER_TEMP "tesseract"
          New-Item -ItemType Directory -Force -Path "$dst\tessdata" | Out-Null
          Copy-Item "$src\tesseract.exe" $dst
          Copy-Item "$src\*.dll" $dst
          foreach ($item in @("configs", "tessconfigs", "pdf.ttf", "pol.traineddata", "eng.traineddata", "osd.traineddata")) {
            $path = Join-Path "$src\tessdata" $item
            if (Test-Path $path) { Copy-Item $path "$dst\tessdata" -Recurse }
          }
          if (Test-Path "$src\doc") { Copy-Item "$src\doc" "$dst\doc" -Recurse }
          Get-ChildItem $dst | Format-Table Name, Length
          "LOKALOCR_TESSERACT_DIR=$dst" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install the application and PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($env:LOKALOCR_BUILD_FULL -eq "1") {
            python -m pip install -e ".[full]" "pyinstaller==6.22.3"
          } else {
            python -m pip install -e . "pyinstaller==6.22.3"
          }

      - name: Cache models (full)
        if: matrix.variant == 'full'
        id: models-cache
        uses: actions/cache@v5
        with:
          path: models
          key: docling-models-2.138.0-${{ hashFiles('scripts/fetch_models.py') }}
      - name: Download models (full)
        if: matrix.variant == 'full' && steps.models-cache.outputs.cache-hit != 'true'
        run: python scripts/fetch_models.py
      - name: Verify models (full)
        if: matrix.variant == 'full'
        run: python scripts/fetch_models.py --verify

      - name: Build with PyInstaller
        run: pyinstaller packaging/lokalocr.spec --noconfirm --clean

      - name: Self-test of the packaged application
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $env:PATH = "C:\Windows\System32;C:\Windows"   # no system Tesseract on PATH
          $report = Join-Path $env:RUNNER_TEMP "selftest.json"
          $p = Start-Process -FilePath "dist\LokalOCR\LokalOCR.exe" -ArgumentList "--selftest", "`"$report`"" -Wait -PassThru
          Get-Content $report -Encoding utf8
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
          & "dist\LokalOCR\lokalocr-cli.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "CLI failed" }

      - name: Add user documentation to the package
        shell: pwsh
        run: |
          Copy-Item docs\install-windows.md "dist\LokalOCR\INSTRUKCJA.md"
          Copy-Item THIRD_PARTY_NOTICES.md "dist\LokalOCR\THIRD_PARTY_NOTICES.md"
          $size = (Get-ChildItem dist\LokalOCR -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB
          "Package size: {0:N0} MB" -f $size

      - uses: actions/upload-artifact@v6
        with:
          name: LokalOCR-windows-${{ matrix.variant }}
          path: dist/LokalOCR
          retention-days: 30
          # Ship exactly what passed the self-test (the default drops dot-files).
          include-hidden-files: true

  release:
    name: publish the download (Releases)
    needs: build
    # Only builds of main become the downloadable version. A failed (optional)
    # full build still publishes the basic package.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: LokalOCR-windows-*
          path: artifacts

      - name: Check the full package's models against their manifest
        # The self-test runs before the upload; this checks what is published.
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          for root in sorted(pathlib.Path("artifacts").glob("LokalOCR-windows-*")):
              folder = root / "_internal" / "models" / "docling"
              manifest = folder / "MANIFEST.json"
              if not manifest.is_file():
                  if root.name.endswith("-full"):
                      sys.exit(f"{root.name}: models/docling/MANIFEST.json is missing")
                  continue
              entries = json.loads(manifest.read_text(encoding="utf-8"))["files"]
              bad = [
                  e["path"] for e in entries
                  if not any(part.startswith(".") for part in e["path"].split("/"))
                  and (not (folder / e["path"]).is_file()
                       or (folder / e["path"]).stat().st_size != e["size"])
              ]
              if bad:
                  sys.exit(f"{root.name}: incomplete models: {bad[:5]}")
              print(f"{root.name}: {len(entries)} model files listed, all present")
          PY

      - name: Zip the packages (one LokalOCR folder per ZIP)
        run: |
          set -euo pipefail
          test -d artifacts/LokalOCR-windows-basic || { echo "basic package missing"; exit 1; }
          mkdir release
          for dir in artifacts/LokalOCR-windows-*; do
            name=$(basename "$dir")
            mkdir stage
            mv "$dir" stage/LokalOCR
            (cd stage && zip -q -r "../release/$name.zip" LokalOCR)
            rm -rf stage
          done
          ls -lh release

      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          Najnowsza wersja LokalOCR dla Windows, zbudowana automatycznie z gałęzi main (commit ${GITHUB_SHA::7}, $(date -u +%Y-%m-%d)).

          **Jak uruchomić**
          1. Pobierz **LokalOCR-windows-basic.zip** poniżej (tryb podstawowy, ok. 200 MB). Wersja **full** (ok. 1 GB) dodaje tryb pełny: strukturę dokumentu, tabele i automatyczne wyciąganie obrazów.
          2. Kliknij ZIP prawym przyciskiem → **Wyodrębnij wszystko…** (nie uruchamiaj programu z wnętrza ZIP-a).
          3. W rozpakowanym folderze uruchom **LokalOCR.exe**. Jeśli Windows pokaże „System Windows ochronił komputer”, wybierz **Więcej informacji → Uruchom mimo to** (program nie jest podpisany cyfrowo).

          Szczegóły: plik INSTRUKCJA.md w paczce. Aplikacja działa w pełni offline.
          EOF
          gh release delete najnowsza --cleanup-tag --yes || true
          gh release create najnowsza release/*.zip \
            --target "$GITHUB_SHA" \
            --title "LokalOCR — najnowsza wersja (Windows)" \
            --notes-file notes.md \
            --latest
