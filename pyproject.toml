[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "lokalocr"
version = "0.1.0"
description = "Offline OCR and document conversion desktop application"
readme = "README.md"
requires-python = ">=3.12"
# Runtime dependencies are added per stage (§10). Every new entry needs its
# license noted in the PR and must pass scripts/check_licenses.py.
dependencies = [
    "numpy==2.5.4",                      # BSD-3-Clause
    "opencv-python-headless==5.0.0.93",  # Apache-2.0
    "pillow==12.3.0",                    # MIT-CMU
    "pypdfium2==5.14.0",                 # Apache-2.0 OR BSD-3-Clause (PDFium: BSD-3-Clause)
    "PySide6-Essentials==6.12.0",        # LGPL-3.0-only (dynamically linked Qt)
    "python-docx==1.2.0",                # MIT (+ lxml: BSD-3-Clause)
]

[project.scripts]
lokalocr = "lokalocr.cli:main"

[project.gui-scripts]
lokalocr-gui = "lokalocr.ui.app:main"

[project.optional-dependencies]
# Full mode (§5): document structure with Docling (MIT) and local models.
# Pulls PyTorch (BSD-3-Clause); on Linux install the CPU build first, e.g.
# pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
full = [
    "docling==2.138.0",
]
dev = [
    "mypy==2.4.0",
    "pre-commit==4.7.0",
    "pytest==9.1.1",
    "pytest-qt==4.5.0",
    "rapidfuzz==3.14.6",
    "ruff==0.17.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lokalocr"]

# --- ruff -------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N",
    "TID",  # flake8-tidy-imports: banned network APIs (§6.3)
]

# `strings_pl as S` keeps UI code readable.
ignore = ["N812"]

# Polish typography uses the en dash in UI texts.
allowed-confusables = ["–"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# Application code must never talk to the network (§0.1, §6.3).
# Mirrored by tests/test_banned_imports.py, which also fails on `import x`
# forms that ruff may not flag.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"requests".msg = "Network libraries are banned in LokalOCR (offline-only, see CLAUDE.md §6)."
"httpx".msg = "Network libraries are banned in LokalOCR (offline-only, see CLAUDE.md §6)."
"urllib3".msg = "Network libraries are banned in LokalOCR (offline-only, see CLAUDE.md §6)."
"aiohttp".msg = "Network libraries are banned in LokalOCR (offline-only, see CLAUDE.md §6)."
"urllib.request".msg = "Network access is banned in LokalOCR (offline-only, see CLAUDE.md §6)."
"http.client".msg = "Network access is banned in LokalOCR (offline-only, see CLAUDE.md §6)."

[tool.ruff.lint.per-file-ignores]
# Developer scripts run outside the app; fetch_models.py is the one place
# allowed to download (§6.4).
"scripts/fetch_models.py" = ["TID251"]
"scripts/model_licenses.py" = ["TID251", "E501"]
# Synthetic document text reads better unwrapped.
"scripts/make_fixtures.py" = ["E501"]
"src/lokalocr/ui/strings_pl.py" = ["E501"]
# Qt style sheet template lines.
"src/lokalocr/ui/theme.py" = ["E501"]
# Qt virtual method overrides keep their camelCase names.
"src/lokalocr/ui/**" = ["N802"]
"tests/test_ui.py" = ["N802"]

# --- mypy -------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
mypy_path = ["src", "scripts"]

[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*", "docx", "docx.*", "docling", "docling.*",
          "docling_core", "docling_core.*", "huggingface_hub", "huggingface_hub.*"]
ignore_missing_imports = true

# --- pytest -----------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "models: needs the full-mode models in models/ (optional, run locally)",
    "tesseract: needs the tesseract binary with pol+eng data",
    "slow: takes more than a few seconds",
    "docling: needs the docling package (pip install -e .[full])",
]
